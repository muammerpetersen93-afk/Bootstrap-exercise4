<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Contact | UrbanCraft Store</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">SHOE STORE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0">
            <a href="index.html" class="btn btn-outline-light border-0 rounded-pill px-4">Home</a>
            <a href="product.html" class="btn btn-outline-light border-0 rounded-pill px-4">Product</a>
            <a href="about.html" class="btn btn-outline-light border-0 rounded-pill px-4">About</a>
            <a href="contact.html" class="btn btn-outline-light border-0 rounded-pill px-4 active" aria-current="page">Contact</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 animate__animated animate__fadeInUp">
          
          <div class="alert alert-info mb-4" role="alert">
            Have a question about one of our products? Fill out the form below to send us an email.
          </div>

          <div class="card border-0 shadow-sm p-4 p-md-5">
            <h1 class="h3 fw-bold mb-4 text-center">Send Us a Message</h1>
            <form action="#" method="post" onsubmit="return false;">
              <div class="mb-3">
                <label for="userName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="userName" placeholder="e.g. JEFF BOB" required>
              </div>

              <div class="mb-3">
                <label for="userEmail" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
              </div>

              <div class="mb-3">
                <label for="userSubject" class="form-label fw-semibold">Subject</label>
                <select class="form-select" id="userSubject">
                  <option selected>Product Inquiry</option>
                  <option value="1">Order Support</option>
                  <option value="2">General Feedback</option>
                </select>
              </div>

              <div class="mb-4">
                <label for="userMessage" class="form-label fw-semibold">Message</label>
                <textarea class="form-control" id="userMessage" rows="4" placeholder="Write your message here..." required></textarea>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg rounded-pill fw-semibold">
                  Send Email
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </main>
    <footer class="bg-dark text-white py-4 mt-auto">
      <div class="container">
        <div class="row gy-3 align-items-center">
          <div class="col-md-6 text-center text-md-start">
            <span class="fw-bold">UrbanCraft Store</span> &mdash; <span class="text-white-50 small">&copy; 2026 All rights reserved.</span>
          </div>
          <div class="col-md-6">
            <ul class="nav justify-content-center justify-content-md-end gap-2">
              <li class="nav-item"><a href="index.html" class="btn btn-outline-light border-0 rounded-pill btn-sm px-3">Home</a></li>
              <li class="nav-item"><a href="product.html" class="btn btn-outline-light border-0 rounded-pill btn-sm px-3">Product</a></li>
              <li class="nav-item"><a href="about.html" class="btn btn-outline-light border-0 rounded-pill btn-sm px-3">About</a></li>
              <li class="nav-item"><a href="contact.html" class="btn btn-outline-light border-0 rounded-pill btn-sm px-3">Contact</a></li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
    <script src="https://jsdelivr.net"></script>
  </body>
</html>
